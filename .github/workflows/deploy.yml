# Publica no GitHub Pages a cada push na main.
#
# Backend é o Supabase — nenhum segredo entra aqui. O endereço da Edge Function
# no código é público por design; quem autoriza é o crachá conferido no servidor.
name: Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci falha de propósito se o package-lock não bater com o package.json
      # — inconsistência que já deixou site congelado em deploy velho sem aviso.
      - run: npm ci

      # O PORTÃO FICA ANTES DO DEPLOY, NÃO DEPOIS. Esta casa tem 13 arquivos de
      # teste que, até 30/08/2026, não rodavam em lugar nenhum: a máquina do Léo
      # não tem node, e o CI só fazia build. Teste que ninguém roda é comentário
      # com sintaxe. Aqui lint e teste REPROVAM o deploy — o site velho continua
      # no ar, que é melhor que um site novo quebrado.
      - run: npm run lint
      - run: npm test

      - run: npm run build
        env:
          BASE_PATH: /minaslab-painel/

      # CRM MinasLab (pasta crm/): app próprio (React 19 + TS + supabase-js),
      # publicado dentro do painel em /minaslab-painel/crm/. As chaves abaixo
      # são PÚBLICAS por design (URL do projeto + publishable key); quem
      # protege os dados é o RLS e as Edge Functions no Supabase.
      # O CRM (Vite 8 + supabase-js 2.116) pede Node 22; o painel segue no 20.
      - name: CRM · Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: CRM · instalar
        working-directory: crm
        run: npm ci --no-audit --no-fund
      - name: CRM · typecheck
        working-directory: crm
        run: npm run typecheck
      - name: CRM · build
        working-directory: crm
        run: npm run build
        env:
          CRM_BASE_PATH: /minaslab-painel/crm/
          VITE_SUPABASE_URL: https://reoghclxripktzpdwhiy.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_YG38KEPCwoKfiQ7PZM2EBg_8cY1vIH7
          VITE_APP_URL: https://leogpereira-afk.github.io/minaslab-painel/crm
      - run: cp -r crm/dist dist/crm

      # SPA no Pages: não há rewrite de servidor. O 404.html é o index do
      # painel (refresh/bookmark de subpágina funciona; o Router com basename
      # assume dali) com um desvio no topo: caminho /crm/... vai para o index
      # do CRM, que restaura a rota. Ver scripts/crm-404.mjs.
      - run: node scripts/crm-404.mjs dist /minaslab-painel/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
