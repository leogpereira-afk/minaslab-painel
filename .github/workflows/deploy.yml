# Publica no GitHub Pages a cada push na main.
#
# Backend é o Supabase — nenhum segredo entra aqui. O endereço da Edge Function
# no código é público por design; quem autoriza é o crachá conferido no servidor.
name: Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci falha de propósito se o package-lock não bater com o package.json
      # — inconsistência que já deixou site congelado em deploy velho sem aviso.
      - run: npm ci

      # O PORTÃO FICA ANTES DO DEPLOY, NÃO DEPOIS. Esta casa tem 13 arquivos de
      # teste que, até 30/08/2026, não rodavam em lugar nenhum: a máquina do Léo
      # não tem node, e o CI só fazia build. Teste que ninguém roda é comentário
      # com sintaxe. Aqui lint e teste REPROVAM o deploy — o site velho continua
      # no ar, que é melhor que um site novo quebrado.
      - run: npm run lint
      - run: npm test

      - run: npm run build
        env:
          BASE_PATH: /minaslab-painel/

      # SPA no Pages: não há rewrite de servidor. O 404.html = cópia do index
      # faz refresh/bookmark de subpágina funcionar; o Router (com basename)
      # assume dali.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
