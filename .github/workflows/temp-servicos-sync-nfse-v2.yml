name: Validar integracao Servicos NFS-e
on:
  push:
    branches: [financeiro/servicos-sync-nfse-mlab]
jobs:
  patch-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: financeiro/servicos-sync-nfse-mlab
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Aplicar patch
        run: python scripts/temp_patch_servicos_nfse.py
      - name: Instalar e validar build
        run: |
          npm ci
          npm run build
      - name: Commit das alteracoes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/api.js src/services/servicosGerados.js src/pages/ServicosGerados.jsx src/pages/EmitirNfse.jsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: automatizar pagamentos e emitir nfse M Lab por servico"
          git push
