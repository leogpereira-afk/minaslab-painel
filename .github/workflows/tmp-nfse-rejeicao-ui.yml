name: Temp NFS-e Rejeicao UI
on:
  push:
    branches: [financeiro/nfse-rejeicao-reenvio]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: financeiro/nfse-rejeicao-reenvio
      - name: Patch EmitirNfse
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          p=Path('src/pages/EmitirNfse.jsx')
          s=p.read_text()
          s=s.replace('const [prevalidando,setPrevalidando]=useState(false);','const [prevalidando,setPrevalidando]=useState(false);\n  const [rejeicaoModal,setRejeicaoModal]=useState(null);')
          s=s.replace('const producao=estado?.ambiente==="PRODUCAO";','const notaAtual=rascunhos.find(x=>x.id===form.id)||null;\n  const rejeitadaAtual=notaAtual?.status_fiscal==="REJEITADA";\n  const producao=estado?.ambiente==="PRODUCAO";')
          marker='  const etapasExibidas=prevalidando?'
          helper='  function motivosRejeicao(x){const d=x?.nfse_dados||{};const a=d?.producaoTentativa?.errosSefin||[];const h=(d?.historicoFiscal||[]).flatMap(t=>t?.errosSefin||[]);const todos=[...a,...h];const unicos=[];for(const e of todos){const k=`${e?.Codigo||e?.codigo||""}|${e?.Descricao||e?.descricao||e?.mensagem||""}`;if(k!=="|"&&!unicos.some(u=>u.k===k))unicos.push({k,codigo:e?.Codigo||e?.codigo||"",descricao:e?.Descricao||e?.descricao||e?.mensagem||"Erro fiscal informado pela SEFIN."})}return unicos}\n\n'
          s=s.replace(marker,helper+marker)
          old='<td><span className="rounded-full bg-slate-100 px-2 py-1 text-xs font-semibold">{x.status_fiscal||"—"}</span></td><td>{x.nfse_ambiente||"—"}</td><td className="text-right"><button className="btn-ghost" onClick={()=>editar(x)}>Abrir</button></td>'
          new='<td><span className={`rounded-full px-2 py-1 text-xs font-semibold ${x.status_fiscal==="REJEITADA"?"bg-red-100 text-red-700":"bg-slate-100 text-slate-700"}`}>{x.status_fiscal||"—"}</span>{x.status_fiscal==="REJEITADA"&&motivosRejeicao(x)[0]&&<div className="mt-1 max-w-[260px] truncate text-xs text-red-600">{motivosRejeicao(x)[0].codigo?`${motivosRejeicao(x)[0].codigo} · `:""}{motivosRejeicao(x)[0].descricao}</div>}</td><td>{x.nfse_ambiente||"—"}</td><td className="text-right"><div className="flex justify-end gap-1">{x.status_fiscal==="REJEITADA"&&<button className="btn-ghost text-red-700" onClick={()=>setRejeicaoModal(x)}>Ver motivo</button>}<button className="btn-ghost" onClick={()=>editar(x)}>{x.status_fiscal==="REJEITADA"?"Corrigir":"Abrir"}</button></div></td>'
          if old not in s: raise SystemExit('table marker not found')
          s=s.replace(old,new)
          s=s.replace('{emitindo?"Transmitindo...":producao?"Emitir NFS-e REAL":"Emitir em homologação"}','{emitindo?"Transmitindo...":producao?(rejeitadaAtual?"Reenviar NFS-e REAL":"Emitir NFS-e REAL"):"Emitir em homologação"}')
          modal='''\n    {rejeicaoModal&&<div className="fixed inset-0 z-[80] flex items-center justify-center bg-slate-900/55 p-4" onMouseDown={e=>{if(e.target===e.currentTarget)setRejeicaoModal(null)}}><div className="w-full max-w-2xl overflow-hidden rounded-2xl bg-white shadow-2xl"><div className="flex items-start justify-between border-b bg-red-50 px-6 py-5"><div><h3 className="text-lg font-bold text-red-800">NFS-e rejeitada</h3><p className="mt-1 text-sm text-red-700">{rejeicaoModal.cliente?.nome||rejeicaoModal.nome_destinatario||"Cliente"}</p></div><button className="btn-ghost h-9 w-9 p-0" onClick={()=>setRejeicaoModal(null)}><X size={18}/></button></div><div className="p-6"><p className="text-sm text-slate-600">A SEFIN não autorizou esta NFS-e. Corrija os itens abaixo, salve o rascunho e faça uma nova pré-validação antes de reenviar.</p><div className="mt-4 space-y-3">{motivosRejeicao(rejeicaoModal).length?motivosRejeicao(rejeicaoModal).map((m,i)=><div key={`${m.codigo}-${i}`} className="rounded-xl border border-red-200 bg-red-50 p-4"><div className="text-xs font-bold uppercase tracking-wide text-red-600">{m.codigo||"Retorno SEFIN"}</div><div className="mt-1 font-semibold text-red-800">{m.descricao}</div></div>):<div className="rounded-xl border bg-slate-50 p-4 text-sm text-slate-600">Não há descrição detalhada gravada para esta tentativa. Abra a nota para revisar os dados e pré-validar novamente.</div>}</div><div className="mt-5 rounded-xl border bg-slate-50 p-4 text-xs text-slate-600"><b>Fluxo seguro:</b> Corrigir nota → Salvar rascunho → Pré-validar → Reenviar NFS-e. Notas autorizadas não entram neste fluxo.</div></div><div className="flex justify-end gap-2 border-t bg-slate-50 p-4"><button className="btn-outline" onClick={()=>setRejeicaoModal(null)}>Fechar</button><button className="btn-primary" onClick={()=>{const x=rejeicaoModal;setRejeicaoModal(null);editar(x)}}>Corrigir nota</button></div></div></div>}\n'''
          anchor='    {prevalidacaoModal&&'
          if anchor not in s: raise SystemExit('modal anchor not found')
          s=s.replace(anchor,modal+'\n'+anchor)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/EmitirNfse.jsx
          git commit -m "Financeiro: detalhar rejeicao e permitir reenvio NFS-e"
          git push