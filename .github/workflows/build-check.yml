name: Build Check
on:
  pull_request:
    branches: [main]
  push:
    branches: [estoque-migracao-gas]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /minaslab-painel/

      # CRM MinasLab (crm/) — mesmo build do deploy, para o PR reprovar antes
      # de a main quebrar o Pages.
      # O CRM (Vite 8 + supabase-js 2.116) pede Node 22; o painel segue no 20.
      - name: CRM · Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: CRM · instalar
        working-directory: crm
        run: npm ci --no-audit --no-fund
      - name: CRM · typecheck
        working-directory: crm
        run: npm run typecheck
      - name: CRM · build
        working-directory: crm
        run: npm run build
        env:
          CRM_BASE_PATH: /minaslab-painel/crm/
          VITE_SUPABASE_URL: https://reoghclxripktzpdwhiy.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_YG38KEPCwoKfiQ7PZM2EBg_8cY1vIH7
          VITE_APP_URL: https://leogpereira-afk.github.io/minaslab-painel/crm
      - run: cp -r crm/dist dist/crm
      - run: node scripts/crm-404.mjs dist /minaslab-painel/
